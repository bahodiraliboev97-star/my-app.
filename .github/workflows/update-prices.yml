name: update-prices
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install TelegramGifts requests
      - run: python update_prices.py
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
